[project]
name = "heulatrade-market-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "duckdb>=1.5,<2", "pandas>=2.2,<3", "pyarrow>=18,<25"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
